name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # -------------------
  # Build all services
  # -------------------
  build:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:24.0.5-dind
        options: --privileged
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker images
        run: |
          docker compose build

      - name: List running containers (test)
        run: |
          docker compose up -d
          sleep 15
          docker ps

      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: auth-service
          severity-threshold: HIGH,CRITICAL
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: core-service
          severity-threshold: HIGH,CRITICAL
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: api-gateway
          severity-threshold: HIGH,CRITICAL
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: erp-ui
          severity-threshold: HIGH,CRITICAL

      - name: Push Docker images
        run: |
          docker tag auth-service ${{ secrets.DOCKER_REGISTRY }}/auth-service:latest
          docker tag core-service ${{ secrets.DOCKER_REGISTRY }}/core-service:latest
          docker tag api-gateway ${{ secrets.DOCKER_REGISTRY }}/api-gateway:latest
          docker tag erp-ui ${{ secrets.DOCKER_REGISTRY }}/erp-ui:latest
          docker push ${{ secrets.DOCKER_REGISTRY }}/auth-service:latest
          docker push ${{ secrets.DOCKER_REGISTRY }}/core-service:latest
          docker push ${{ secrets.DOCKER_REGISTRY }}/api-gateway:latest
          docker push ${{ secrets.DOCKER_REGISTRY }}/erp-ui:latest