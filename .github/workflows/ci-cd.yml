name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker images
        run: docker compose build

      - name: Scan images with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            auth-service:latest
            
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            core-service:latest

      - name: Push images to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag auth-service:latest syrinebenanaya/auth-service:latest
          docker tag core-service:latest syrinebenanaya/core-service:latest
          docker tag api-gateway:latest syrinebenanaya/api-gateway:latest
          docker tag erp-ui:latest syrinebenanaya/erp-ui:latest
          
          docker push syrinebenanaya/auth-service:latest
          docker push syrinebenanaya/core-service:latest
          docker push syrinebenanaya/api-gateway:latest
          docker push syrinebenanaya/erp-ui:latest