name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci_cd:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:24.0.5-dind
        options: --privileged
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

        uses: docker/login-action@v2
        with:
         username: ${{ secrets.DOCKER_USERNAME }}
         password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker images
        run: |
          docker compose build

      - name: List running containers
        run: |
          docker compose up -d
          sleep 15
          docker ps

      - name: Security scan with Trivy
        run: |
          trivy image docker.io/syrinebenanaya/auth-service:latest --severity HIGH,CRITICAL || true
          trivy image docker.io/syrinebenanaya/core-service:latest --severity HIGH,CRITICAL || true
          trivy image docker.io/syrinebenanaya/api-gateway:latest --severity HIGH,CRITICAL || true
          trivy image docker.io/syrinebenanaya/erp-ui:latest --severity HIGH,CRITICAL || true

      - name: Tag & Push Docker images
        run: |
          docker tag auth-service docker.io/syrinebenanaya/auth-service:latest
          docker tag core-service docker.io/syrinebenanaya/core-service:latest
          docker tag api-gateway docker.io/syrinebenanaya/api-gateway:latest
          docker tag erp-ui docker.io/syrinebenanaya/erp-ui:latest

          docker push docker.io/syrinebenanaya/auth-service:latest
          docker push docker.io/syrinebenanaya/core-service:latest
          docker push docker.io/syrinebenanaya/api-gateway:latest
          docker push docker.io/syrinebenanaya/erp-ui:latest