name: CI-CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write  # Changé de 'read' à 'write' pour permettre le push
  security-events: write
  actions: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker images
        run: docker compose build

      - name: Run Trivy vulnerability scanner (non-blocking)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Tag and push images to Docker Hub
        run: |
          # Générer un tag avec le commit SHA
          COMMIT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          TAG="${COMMIT_SHA}-${TIMESTAMP}"
          
          echo "Tagging images with: $TAG"
          
          # Tag avec le commit SHA (pour les rollbacks)
          docker tag auth-service:latest syrinebenanaya/auth-service:${TAG}
          docker tag core-service:latest syrinebenanaya/core-service:${TAG}
          docker tag api-gateway:latest syrinebenanaya/api-gateway:${TAG}
          docker tag erp-ui:latest syrinebenanaya/erp-ui:${TAG}
          
          # Tag latest également
          docker tag auth-service:latest syrinebenanaya/auth-service:latest
          docker tag core-service:latest syrinebenanaya/core-service:latest
          docker tag api-gateway:latest syrinebenanaya/api-gateway:latest
          docker tag erp-ui:latest syrinebenanaya/erp-ui:latest
          
          # Push tous les tags
          docker push syrinebenanaya/auth-service --all-tags
          docker push syrinebenanaya/core-service --all-tags
          docker push syrinebenanaya/api-gateway --all-tags
          docker push syrinebenanaya/erp-ui --all-tags
          
          # Sauvegarder le tag pour l'étape suivante
          echo "TAG=${TAG}" >> $GITHUB_ENV

      - name: Update Kubernetes manifests with new tag
        run: |
          # Correction: ton fichier s'appelle k8s-complete.yaml à la racine
          sed -i "s|image: syrinebenanaya/auth-service:.*|image: syrinebenanaya/auth-service:${TAG}|g" k8s-complete.yaml
          sed -i "s|image: syrinebenanaya/core-service:.*|image: syrinebenanaya/core-service:${TAG}|g" k8s-complete.yaml
          sed -i "s|image: syrinebenanaya/api-gateway:.*|image: syrinebenanaya/api-gateway:${TAG}|g" k8s-complete.yaml
          sed -i "s|image: syrinebenanaya/erp-ui:.*|image: syrinebenanaya/erp-ui:${TAG}|g" k8s-complete.yaml

      - name: Commit and push manifest updates
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add k8s-complete.yaml
          git commit -m "chore: update images to ${TAG}" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cd:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger ArgoCD Sync
        run: |
          echo "✅ ArgoCD détectera automatiquement les changements dans le repo Git"
          echo "ArgoCD est configuré en mode auto-sync (prune: true, selfHeal: true)"
          echo ""
          echo "📊 Statut de synchronisation:"
          echo "   - ArgoCD surveille le dépôt Git"
          echo "   - Les nouveaux tags d'images sont détectés"
          echo "   - La synchronisation automatique s'effectue en < 3 minutes"
          echo "   - Les pods sont recréés avec les nouvelles images"

      - name: Verify deployment status (optional)
        run: |
          echo "🔍 Pour vérifier manuellement la synchronisation:"
          echo "   kubectl get application cristal-erp -n argocd"
          echo "   kubectl get pods -n erp-system -w"