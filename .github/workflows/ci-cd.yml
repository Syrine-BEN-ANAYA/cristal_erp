name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci_cd:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build images
      - name: Build Docker images
        run: docker compose build

      # 5. Security scan (LOCAL images)
      - name: Scan images with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL --exit-code 1 auth-service:latest

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL --exit-code 1 core-service:latest

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL --exit-code 1 api-gateway:latest

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL --exit-code 1 erp-ui:latest

      # 6. Tag images with commit SHA
      - name: Tag Docker images
        run: |
          docker tag auth-service:latest docker.io/syrinebenanaya/auth-service:${{ github.sha }}
          docker tag core-service:latest docker.io/syrinebenanaya/core-service:${{ github.sha }}
          docker tag api-gateway:latest docker.io/syrinebenanaya/api-gateway:${{ github.sha }}
          docker tag erp-ui:latest docker.io/syrinebenanaya/erp-ui:${{ github.sha }}

      # 7. Push images
      - name: Push Docker images
        run: |
          docker push docker.io/syrinebenanaya/auth-service:${{ github.sha }}
          docker push docker.io/syrinebenanaya/core-service:${{ github.sha }}
          docker push docker.io/syrinebenanaya/api-gateway:${{ github.sha }}
          docker push docker.io/syrinebenanaya/erp-ui:${{ github.sha }}