name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMES: auth-service core-service api-gateway erp-ui   # adapte selon tes services

jobs:
  # ==================== JOB CI (sur runners cloud) ====================
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Tests unitaires (à adapter selon ton stack) ---
      - name: Run unit tests
        run: |
          # Exemple : docker compose run --rm auth-service npm test
          echo "Ajoute ici tes tests unitaires"

      # --- SAST : scan du code source avec Trivy ---
      - name: Scan source code with Trivy
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/src \
            ghcr.io/aquasecurity/trivy:latest fs --severity HIGH,CRITICAL /src

      # --- Secret scanning avec Gitleaks ---
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Build des images Docker ---
      - name: Build Docker images
        run: docker compose build

      # --- Scan des images avec Trivy ---
      - name: Scan images with Trivy
        run: |
          for img in ${{ env.IMAGE_NAMES }}; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              ghcr.io/aquasecurity/trivy:latest image --severity HIGH,CRITICAL "$img:latest"
          done

      # --- Connexion au registre et push (seulement sur main) ---
      - name: Log in to container registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker images
        if: github.ref == 'refs/heads/main'
        run: docker compose push

  # ==================== JOB CD (sur runner auto-hébergé) ====================
  cd:
    needs: ci
    runs-on: self-hosted                     # ton runner local
    if: github.ref == 'refs/heads/main'      # seulement sur main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # --- Pull des dernières images (depuis GHCR) ---
      - name: Log in to container registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Pull Docker images
        run: docker compose pull

      # --- Déploiement (choisir une des deux options) ---

      # Option 1 : Déploiement avec Docker Compose (simple)
      - name: Deploy with Docker Compose
        run: docker compose up -d

      # Option 2 : Déploiement avec Kubernetes (si tu utilises kubectl)
      # - name: Deploy with kubectl
      #   run: kubectl apply -f k8s/