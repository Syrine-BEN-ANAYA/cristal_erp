name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  # À remplacer par ton nom d'utilisateur GitHub
  USERNAME: Syrine-BEN-ANAYA
  IMAGE_NAMES: auth-service core-service api-gateway erp-ui
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci_cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build

      - name: Scan images with Trivy
        run: |
          for img in ${{ env.IMAGE_NAMES }}; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              ghcr.io/aquasecurity/trivy:latest image --severity HIGH,CRITICAL "$img:latest"
          done

      - name: Log in to container registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker images
        if: github.ref == 'refs/heads/main'
        run: docker compose push

  cd:
    needs: ci_cd
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to container registry
        shell: pwsh
        run: |
          $env:GITHUB_TOKEN = "${{ secrets.GITHUB_TOKEN }}"
          $env:REGISTRY = "${{ env.REGISTRY }}"
          $env:GITHUB_ACTOR = "${{ github.actor }}"
          echo $env:GITHUB_TOKEN | docker login $env:REGISTRY -u $env:GITHUB_ACTOR --password-stdin

      - name: Pull Docker images
        shell: pwsh
        run: docker compose pull

      - name: Deploy with Docker Compose
        shell: pwsh
        run: docker compose up -d

      - name: Clean up old images
        shell: pwsh
        run: docker image prune -f