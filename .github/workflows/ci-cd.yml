name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci_cd:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:24.0.5-dind
        options: --privileged
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build, Test, Scan & Push Docker images
        run: |
          # Build images
          docker compose build
          
          # Test containers
          docker compose up -d
          sleep 15
          docker ps
          
          # Security scan (optionnel, ne bloque pas le workflow)
          trivy image auth-service --exit-code 1 --severity HIGH,CRITICAL || true
          trivy image core-service --exit-code 1 --severity HIGH,CRITICAL || true
          trivy image api-gateway --exit-code 1 --severity HIGH,CRITICAL || true
          trivy image erp-ui --exit-code 1 --severity HIGH,CRITICAL || true
          
          # Tag & push to Docker Hub
          docker tag auth-service docker.io/syrinebenanaya/auth-service:latest
          docker tag core-service docker.io/syrinebenanaya/core-service:latest
          docker tag api-gateway docker.io/syrinebenanaya/api-gateway:latest
          docker tag erp-ui docker.io/syrinebenanaya/erp-ui:latest
          
          docker push docker.io/syrinebenanaya/auth-service:latest
          docker push docker.io/syrinebenanaya/core-service:latest
          docker push docker.io/syrinebenanaya/api-gateway:latest
          docker push docker.io/syrinebenanaya/erp-ui:latest