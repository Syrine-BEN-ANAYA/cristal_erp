name: CI-CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Docker images
        run: docker compose build

      - name: Scan Docker images with Trivy
        run: |
          images=(
            "syrinebenanaya/auth-service:latest"
            "syrinebenanaya/core-service:latest"
            "syrinebenanaya/api-gateway:latest"
            "syrinebenanaya/erp-ui:latest"
          )

          for image in "${images[@]}"; do
            echo "Scanning $image ..."
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              ghcr.io/aquasecurity/trivy:latest image \
              --severity HIGH,CRITICAL \
              --exit-code 0 \
              --format table \
              $image
            echo "---------------------------------------------"
          done
        shell: bash

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push images to Docker Hub
        run: |
          docker tag auth-service:latest syrinebenanaya/auth-service:latest
          docker tag core-service:latest syrinebenanaya/core-service:latest
          docker tag api-gateway:latest syrinebenanaya/api-gateway:latest
          docker tag erp-ui:latest syrinebenanaya/erp-ui:latest
          
          docker push syrinebenanaya/auth-service:latest
          docker push syrinebenanaya/core-service:latest
          docker push syrinebenanaya/api-gateway:latest
          docker push syrinebenanaya/erp-ui:latest