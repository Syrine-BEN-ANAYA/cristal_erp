name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci_cd:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout le code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Installer Docker Compose pour éviter exit code 127
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.20.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      # 4. Build les images Docker
      - name: Build Docker images
        run: docker-compose build

      # 5. Scan sécurité avec Trivy
      - name: Scan images with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/aquasecurity/trivy:latest image --severity HIGH,CRITICAL auth-service:latest
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/aquasecurity/trivy:latest image --severity HIGH,CRITICAL core-service:latest
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/aquasecurity/trivy:latest image --severity HIGH,CRITICAL api-gateway:latest
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/aquasecurity/trivy:latest image --severity HIGH,CRITICAL erp-ui:latest

      # 6. Login DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 7. Tag et push des images
      - name: Tag and push images
        run: |
          docker tag auth-service:latest ${{ secrets.DOCKER_USERNAME }}/auth-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:latest

          docker tag core-service:latest ${{ secrets.DOCKER_USERNAME }}/core-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/core-service:latest

          docker tag api-gateway:latest ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest

          docker tag erp-ui:latest ${{ secrets.DOCKER_USERNAME }}/erp-ui:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/erp-ui:latest

      # 8. Setup kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      # 9. Configure kubeconfig
      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" > kubeconfig
          setx KUBECONFIG "%CD%\kubeconfig"

      # 10. Déploiement Kubernetes
      - name: Deploy to Kubernetes
        run: kubectl apply -f k8s/

      # 11. Redémarrage des déploiements
      - name: Restart deployments
        run: |
          kubectl rollout restart deployment auth-service
          kubectl rollout restart deployment core-service
          kubectl rollout restart deployment api-gateway
          kubectl rollout restart deployment erp-ui
          kubectl rollout restart deployment n8n