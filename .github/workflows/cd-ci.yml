name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci_cd:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout le code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Debug secrets (TEMPORAIRE – à supprimer après test)
      - name: Debug secrets
        run: |
          echo "USER=${{ secrets.DOCKER_USERNAME }}"
          echo "PASS LENGTH=$(echo -n "${{ secrets.DOCKER_PASSWORD }}" | wc -c)"

      # 4. Login DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Build les images Docker
      - name: Build Docker images
        run: docker compose build

      # 6. Scan sécurité avec Trivy
      - name: Scan images with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL auth-service:latest
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL core-service:latest
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL api-gateway:latest
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL erp-ui:latest

      # 7. Tag Docker images
      - name: Tag Docker images
        run: |
          docker tag auth-service:latest docker.io/syrinebenanaya/auth-service:${{ github.sha }}
          docker tag core-service:latest docker.io/syrinebenanaya/core-service:${{ github.sha }}
          docker tag api-gateway:latest docker.io/syrinebenanaya/api-gateway:${{ github.sha }}
          docker tag erp-ui:latest docker.io/syrinebenanaya/erp-ui:${{ github.sha }}

      # 8. Push Docker images
      - name: Push Docker images
        run: |
          docker push docker.io/syrinebenanaya/auth-service:${{ github.sha }}
          docker push docker.io/syrinebenanaya/core-service:${{ github.sha }}
          docker push docker.io/syrinebenanaya/api-gateway:${{ github.sha }}
          docker push docker.io/syrinebenanaya/erp-ui:${{ github.sha }}