name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Premier job : analyse statique et dépendances
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: npm audit (tous les services)
        run: |
          for dir in services/*; do
            if [ -f "$dir/package-lock.json" ]; then
              echo "Running npm audit in $dir"
              cd $dir
              npm audit --audit-level=high
              cd -
            fi
          done

      - name: Semgrep – analyse statique du code
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto          # utilise les règles de sécurité par défaut
          output: semgrep-report.json

      - name: Trivy – scan du code source (fichiers)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'        # échoue si des vulnérabilités sont trouvées

  # Second job : construction et scan des images Docker
  build-and-scan-images:
    runs-on: ubuntu-latest
    needs: security-scan       # ne s'exécute que si le premier job réussit
    strategy:
      matrix:
        service: [auth-service, core-service, api-gateway, erp-ui]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker compose build ${{ matrix.service }}

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:latest \
            image --severity HIGH,CRITICAL --exit-code 1 \
            ${{ matrix.service }}:latest

      # Optionnel : pousser les images vers un registre (ex: Docker Hub, GHCR)
      # - name: Log in to container registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      #
      # - name: Push image
      #   run: |
      #     docker tag ${{ matrix.service }}:latest ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
      #     docker push ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest