# ==================== NAMESPACE ====================
apiVersion: v1
kind: Namespace
metadata:
  name: erp-system

# ==================== VOLUMES ====================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: erp-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  namespace: erp-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarqube-db-data
  namespace: erp-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

# ==================== CONFIGMAPS ====================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: erp-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'mongodb-exporter'
        static_configs:
          - targets: ['mongodb-exporter:9216']
      - job_name: 'auth-service'
        static_configs:
          - targets: ['auth-service:3101']
      - job_name: 'core-service'
        static_configs:
          - targets: ['core-service:3102']
      - job_name: 'api-gateway'
        static_configs:
          - targets: ['api-gateway:3104']

# ==================== MONGO DB ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: erp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
      - name: mongo
        image: mongo:6.0
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo-storage
          mountPath: /data/db
      volumes:
      - name: mongo-storage
        persistentVolumeClaim:
          claimName: mongo-data
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: erp-system
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017

# ==================== MONGODB EXPORTER ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-exporter
  namespace: erp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-exporter
  template:
    metadata:
      labels:
        app: mongodb-exporter
    spec:
      containers:
      - name: mongodb-exporter
        image: bitnami/mongodb-exporter:latest
        ports:
        - containerPort: 9216
        env:
        - name: MONGODB_URI
          value: "mongodb://mongo:27017"
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-exporter
  namespace: erp-system
spec:
  selector:
    app: mongodb-exporter
  ports:
    - port: 9216
      targetPort: 9216

# ==================== AUTH SERVICE ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: erp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: auth-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3101
        env:
        - name: MONGO_URI
          value: "mongodb://mongo:27017/auth-service"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: erp-system
spec:
  selector:
    app: auth-service
  ports:
    - port: 3101
      targetPort: 3101

# ==================== CORE SERVICE ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  namespace: erp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-service
  template:
    metadata:
      labels:
        app: core-service
    spec:
      containers:
      - name: core-service
        image: core-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3102
        env:
        - name: MONGO_URI
          value: "mongodb://mongo:27017/core-service"
---
apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: erp-system
spec:
  selector:
    app: core-service
  ports:
    - port: 3102
      targetPort: 3102

# ==================== API GATEWAY ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: erp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: api-gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3104
        env:
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:3101"
        - name: CORE_SERVICE_URL
          value: "http://core-service:3102"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: erp-system
spec:
  selector:
    app: api-gateway
  ports:
    - port: 3104
      targetPort: 3104
  type: NodePort

# ==================== FRONTEND ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: erp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: erp-ui:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3105
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: erp-system
spec:
  selector:
    app: frontend
  ports:
    - port: 3105
      targetPort: 3105
  type: NodePort

# ==================== N8N ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: erp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
      - name: n8n
        image: n8nio/n8n:latest
        ports:
        - containerPort: 5678
        env:
        - name: N8N_BASIC_AUTH_ACTIVE
          value: "true"
        - name: N8N_BASIC_AUTH_USER
          value: "admin"
        - name: N8N_BASIC_AUTH_PASSWORD
          value: "admin"
        - name: N8N_BINARY_DATA_MODE
          value: "default"
        volumeMounts:
        - name: n8n-storage
          mountPath: /home/node/.n8n
      volumes:
      - name: n8n-storage
        persistentVolumeClaim:
          claimName: n8n-data
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: erp-system
spec:
  selector:
    app: n8n
  ports:
    - port: 5678
      targetPort: 5678
  type: NodePort

# ==================== PROMETHEUS ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: erp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: erp-system
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: NodePort

# ==================== GRAFANA ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: erp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: erp-system
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
  type: NodePort

# ==================== SONARQUBE DB ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube-db
  namespace: erp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarqube-db
  template:
    metadata:
      labels:
        app: sonarqube-db
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "sonarqube"
        - name: POSTGRES_PASSWORD
          value: "sonarqube"
        - name: POSTGRES_DB
          value: "sonarqube"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: sonarqube-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: sonarqube-db
  namespace: erp-system
spec:
  selector:
    app: sonarqube-db
  ports:
    - port: 5432
      targetPort: 5432

# ==================== SONARQUBE ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
  namespace: erp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarqube
  template:
    metadata:
      labels:
        app: sonarqube
    spec:
      containers:
      - name: sonarqube
        image: sonarqube:latest
        ports:
        - containerPort: 9000
        env:
        - name: SONAR_ES_BOOTSTRAP_CHECKS_DISABLE
          value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: sonarqube
  namespace: erp-system
spec:
  selector:
    app: sonarqube
  ports:
    - port: 9000
      targetPort: 9000
  type: NodePort