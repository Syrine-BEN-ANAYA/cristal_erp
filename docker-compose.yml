version: '3.9'

services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - "28017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb-exporter:
    image: bitnami/mongodb-exporter:latest
    container_name: cristal_erp-mongodb-exporter-1
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017
    ports:
      - "9216:9216"
    networks:
      - erp-network
    depends_on:
      - mongo

  auth-service:
    build: ./services/auth-service
    image: auth-service:latest
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/auth-service
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - erp-network

  core-service:
    build: ./services/core-service
    image: core-service:latest
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/core-service
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3202:3102"
    networks:
      - erp-network

  api-gateway:
    build: ./services/api-gateway
    image: api-gateway:latest
    restart: unless-stopped
    ports:
      - "3204:3104"
    depends_on:
      - auth-service
      - core-service
    networks:
      - erp-network

  frontend:
    build: ./erp-ui
    image: erp-ui:latest
    restart: unless-stopped
    ports:
      - "3205:3105"
    depends_on:
      - api-gateway
    networks:
      - erp-network

  n8n:
    image: n8nio/n8n
    restart: unless-stopped
    ports:
      - "5778:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      N8N_BINARY_DATA_MODE: default
    volumes:
      - n8n-data:/home/node/.n8n
      - ./invoices:/home/node/invoices
    networks:
      - erp-network

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - erp-network
    depends_on:
      - auth-service
      - core-service
      - api-gateway
      - mongodb-exporter

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
    networks:
      - erp-network

  sonarqube-db:
    image: postgres:15
    container_name: cristal_erp-sonarqube-db
    environment:
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube
      POSTGRES_DB: sonarqube
    networks:
      - erp-network
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:latest
    container_name: cristal_erp-sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    depends_on:
      - sonarqube-db
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge

volumes:
  mongo-data:
  n8n-data:
  sonarqube-db-data: