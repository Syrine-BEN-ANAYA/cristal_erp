
services:
  mongo:
    image: mongo:6.0
    container_name: mongo
    restart: always
    ports:
      - "28017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - erp-network

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    environment:
      MONGO_URI: mongodb://mongo:27017/auth-service
    depends_on:
      mongo:
        condition: service_started
    networks:
      - erp-network

  core-service:
    build: ./services/core-service
    container_name: core-service
    environment:
      MONGO_URI: mongodb://mongo:27017/core-service
      PORT: 3102
    depends_on:
      mongo:
        condition: service_started
    ports:
      - "3202:3102"
    networks:
      - erp-network

  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    ports:
      - "3204:3104"
    depends_on:
      auth-service:
        condition: service_started
      core-service:
        condition: service_started
    networks:
      - erp-network

  frontend:
    build: ./erp-ui
    container_name: frontend
    ports:
      - "3205:3105"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - erp-network

  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      - "5778:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: admin
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge

volumes:
  mongo-data:
  n8n-data: