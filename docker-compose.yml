
services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - "28017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./services/auth-service
    image: auth-service:latest
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/auth-service
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - erp-network

  core-service:
    build: ./services/core-service
    image: core-service:latest
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/core-service
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3202:3102"
    networks:
      - erp-network

  api-gateway:
    build: ./services/api-gateway
    image: api-gateway:latest
    restart: unless-stopped
    ports:
      - "3204:3104"
    depends_on:
      auth-service:
        condition: service_started
      core-service:
        condition: service_started
    networks:
      - erp-network

  frontend:
    build: ./erp-ui
    image: erp-ui:latest
    restart: unless-stopped
    ports:
      - "3205:3105"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - erp-network

  n8n:
    image: n8nio/n8n
    restart: unless-stopped
    ports:
      - "5778:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      N8N_BINARY_DATA_MODE: default
    volumes:
      - n8n-data:/home/node/.n8n
      - ./invoices:/home/node/invoices
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge

volumes:
  mongo-data:
  n8n-data: