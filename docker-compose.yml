services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - "28017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - erp-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 3

  mongodb-exporter:
    image: bitnami/mongodb-exporter:latest
    container_name: cristal_erp-mongodb-exporter-1
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017
    ports:
      - "9216:9216"
    networks:
      - erp-network
    depends_on:
      - mongo

  auth-service:
    build: ./services/auth-service
    image: auth-service:latest
  
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/auth-service
      PORT:  "3101"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - erp-network

  core-service:
    build: ./services/core-service
    image: core-service:latest
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/core-service
      PORT:  "3102"

    depends_on:
      mongo:
        condition: service_healthy
    
    networks:
      - erp-network

  hr-service:
    build: ./services/hr-service
    image: hr-service:latest
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/hr-service
      PORT:  "3106"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - erp-network

  api-gateway:
    build: ./services/api-gateway
    image: api-gateway:latest
    restart: unless-stopped
    ports:
      - "3204:3104"
    depends_on:
      - auth-service
      - core-service
      - hr-service
    networks:
      - erp-network

  frontend:
    build: ./erp-ui
    image: erp-ui:latest
    restart: unless-stopped
    ports:
      - "3205:80"
    depends_on:
      - api-gateway
    networks:
      - erp-network

  n8n:
    image: n8nio/n8n
    restart: unless-stopped
    ports:
      - "7007:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: admin
      N8N_BINARY_DATA_MODE: default
    volumes:
      - n8n-data:/home/node/.n8n
      - ./invoices:/home/node/invoices
    networks:
      - erp-network

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - erp-network
    depends_on:
      - auth-service
      - core-service
      - hr-service
      - api-gateway
      - mongodb-exporter

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SERVER_ALLOW_EMBEDDING=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_X_FRAME_OPTIONS=allow-from http://localhost:3105
      - GF_SECURITY_X_FRAME_OPTIONS=
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    networks:
      - erp-network

  # ============================================
  # SonarQube avec PostgreSQL
  # ============================================

  sonarqube-db:
    image: postgres:15
    container_name: cristal_erp-sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube
      POSTGRES_DB: sonarqube
    networks:
      - erp-network
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:10.6.0-community
    container_name: cristal_erp-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      SONAR_CE_JAVAOPTS: "-Xmx512m"
      SONAR_WEB_JAVAOPTS: "-Xmx512m"
      SONAR_SEARCH_JAVAOPTS: "-Xmx512m"
    depends_on:
      sonarqube-db:
        condition: service_healthy
    networks:
      - erp-network
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs

networks:
  erp-network:
    driver: bridge

volumes:
  mongo-data:
  n8n-data:
  grafana-data:
  sonarqube-db-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs: