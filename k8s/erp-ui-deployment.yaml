apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: erp-ui
  template:
    metadata:
      labels:
        app: erp-ui
    spec:
      containers:
      - name: erp-ui
        image: docker.io/syrinebenanaya/erp-ui:latest
        ports:
        - containerPort: 3105
---
apiVersion: v1
kind: Service
metadata:
  name: erp-ui
spec:
  selector:
    app: erp-ui
  ports:
    - protocol: TCP
      port: 3105
      targetPort: 3105
  type: ClusterIP