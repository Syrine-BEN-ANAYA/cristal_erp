apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: erp-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'mongodb-exporter'
        static_configs:
          - targets: ['mongodb-exporter:9216']
      - job_name: 'auth-service'
        static_configs:
          - targets: ['auth-service:3101']
      - job_name: 'core-service'
        static_configs:
          - targets: ['core-service:3102']
      - job_name: 'api-gateway'
        static_configs:
          - targets: ['api-gateway:3104']