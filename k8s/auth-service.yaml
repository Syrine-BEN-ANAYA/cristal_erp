apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: erp-system
spec:
  replicas: 2  # Augmenté pour la haute disponibilité
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        version: v1
    spec:
      containers:
      - name: auth-service
        image: auth-service:latest  # Le tag sera remplacé par Kustomize
        imagePullPolicy: IfNotPresent  # Changé de Never
        ports:
        - containerPort: 3101
          name: http
        env:
        - name: MONGO_URI
          value: "mongodb://mongo:27017/auth-service"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3101
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3101
          initialDelaySeconds: 5
          periodSeconds: 5