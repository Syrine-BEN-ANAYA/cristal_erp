# -------------------------------
# ERP UI (FRONTEND)
# -------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-ui
  labels:
    app: erp-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: erp-ui
  template:
    metadata:
      labels:
        app: erp-ui
    spec:
      containers:
      - name: erp-ui
        image: docker.io/syrinebenanaya/erp-ui:latest
        ports:
        - containerPort: 3105
        imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: erp-ui
spec:
  type: NodePort
  selector:
    app: erp-ui
  ports:
    - port: 3105
      targetPort: 3105
      nodePort: 31005

# -------------------------------
# N8N
# -------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
      - name: n8n
        image: n8nio/n8n:latest
        ports:
        - containerPort: 5678
        env:
        - name: N8N_BASIC_AUTH_ACTIVE
          value: "true"
        - name: N8N_BASIC_AUTH_USER
          valueFrom:
            secretKeyRef:
              name: n8n-secret
              key: N8N_USER
        - name: N8N_BASIC_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: n8n-secret
              key: N8N_PASSWORD
        volumeMounts:
        - name: n8n-data
          mountPath: /home/node/.n8n
      volumes:
      - name: n8n-data
        persistentVolumeClaim:
          claimName: n8n-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
spec:
  selector:
    app: n8n
  type: NodePort
  ports:
    - protocol: TCP
      port: 5678
      targetPort: 5678
      nodePort: 30578
      apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarqube
  template:
    metadata:
      labels:
        app: sonarqube
    spec:
      containers:
      - name: sonarqube
        image: sonarqube:lts
        ports:
        - containerPort: 9000
        resources:
          limits:
            memory: "2Gi"
            cpu: "1"
        env:
          - name: SONAR_JDBC_URL
            value: "jdbc:postgresql://postgres:5432/sonar"
---
apiVersion: v1
kind: Service
metadata:
  name: sonarqube
spec:
  selector:
    app: sonarqube
  ports:
    - port: 9000
      targetPort: 9000
  type: NodePort