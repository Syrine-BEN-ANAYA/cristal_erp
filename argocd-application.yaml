apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cristal-erp
  namespace: argocd
spec:
  project: default
  source:
    # Pour les fichiers locaux, on utilise un repo Git local
    repoURL: https://github.com/votre-org/cristal-erp-gitops.git  # À créer
    targetRevision: HEAD
    path: .
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: erp-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true