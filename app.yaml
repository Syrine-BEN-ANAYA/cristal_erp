apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cristal-erp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Syrine-BEN-ANAYA/Cristal_ERP.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: erp-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true